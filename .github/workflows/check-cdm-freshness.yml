# check-cdm-freshness.yml
# rebuild_cdm_v3.py (narrows-pipeline repo) is run by hand, not on a schedule.
# Nothing previously monitored how old the deployed data files actually got
# between manual reruns -- the foundation audit (2026-07-08) found
# simulator_data.json up to ten days stale relative to the pipeline output
# with no signal anywhere that it had drifted, and Fix-113/114/115
# (2026-09-10) found cape_tide_feed.json had gone stale for two months with
# the exact same lack of any alarm. This runs independently of the pipeline
# itself: it just checks the freshness stamp already embedded in each
# deployed file and fails loudly (triggering GitHub's workflow-failure
# notification) once any of them crosses its staleness threshold, so a
# forgotten rebuild gets noticed instead of silently serving old figures.

name: Check CDM data freshness

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily -- after the 06:00 rates bot
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check data freshness (simulator_data.json, cape_tide_feed.json, cape_corridor_feed.json, NARROWS-SIGNALS.js)
        env:
          FRESHNESS_PATH_PREFIX: ''
        run: python3 .github/workflows/check_cdm_freshness.py
